<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码生成器🔐</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .password-display {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 5px;
            margin-bottom: 20px;
            box-sizing: border-box;
            background-color: #f9f9f9;
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .generate-btn {
            background-color: #4CAF50;
            color: white;
        }
        .generate-btn:hover {
            background-color: #45a049;
        }
        .copy-btn {
            background-color: #2196F3;
            color: white;
        }
        .copy-btn:hover {
            background-color: #1976D2;
        }
        .clear-btn {
            background-color: #f44336;
            color: white;
        }
        .clear-btn:hover {
            background-color: #d32f2f;
        }
        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
            margin-right: 10px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #2196F3;
        }
        input:checked + .slider:before {
            transform: translateX(26px);
        }
        .toggle-label {
            font-size: 16px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>密码生成器🔐</h1>
        
        <div class="toggle-container">
            <label class="toggle-switch">
                <input type="checkbox" id="symbolToggle" checked>
                <span class="slider"></span>
            </label>
            <span class="toggle-label">包含标点符号</span>
        </div>
        
        <input type="text" id="passwordDisplay" class="password-display" readonly placeholder="点击生成密码">
        
        <div class="controls">
            <button class="generate-btn" onclick="generatePassword()">生成</button>
            <button class="copy-btn" onclick="copyPassword()">复制</button>
            <button class="clear-btn" onclick="clearPassword()">清除</button>
        </div>
    </div>

    <script>
        function generatePassword() {
            const passwordDisplay = document.getElementById('passwordDisplay');
            const includeSymbols = document.getElementById('symbolToggle').checked;
            
            // 字符集定义
            const lowercase = 'abcdefghijklmnopqrstuvwxyz';
            const uppercase = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const numbers = '0123456789';
            const symbols = '!@#$%^&*()_+-=[]{}|;:,.<>?';
            
            let characters = lowercase + uppercase + numbers;
            if (includeSymbols) {
                characters += symbols;
            }
            
            // 确保密码至少包含每种类型的字符（当包含符号时）
            let password = '';
            const passwordLength = 12; // 默认密码长度
            
            if (includeSymbols) {
                // 包含符号时，确保每种类型至少有一个字符
                password += getRandomChar(lowercase);
                password += getRandomChar(uppercase);
                password += getRandomChar(numbers);
                password += getRandomChar(symbols);
                
                // 填充剩余长度
                for (let i = 4; i < passwordLength; i++) {
                    password += getRandomChar(characters);
                }
            } else {
                // 不包含符号时，确保包含大小写字母和数字
                password += getRandomChar(lowercase);
                password += getRandomChar(uppercase);
                password += getRandomChar(numbers);
                
                // 填充剩余长度
                for (let i = 3; i < passwordLength; i++) {
                    password += getRandomChar(characters);
                }
            }
            
            // 打乱密码字符顺序
            password = shuffleString(password);
            passwordDisplay.value = password;
        }
        
        function getRandomChar(charSet) {
            return charSet.charAt(Math.floor(Math.random() * charSet.length));
        }
        
        function shuffleString(str) {
            const array = str.split('');
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array.join('');
        }
        
        function copyPassword() {
            const passwordDisplay = document.getElementById('passwordDisplay');
            passwordDisplay.select();
            document.execCommand('copy');
            alert('密码已复制到剪贴板！');
        }
        
        function clearPassword() {
            document.getElementById('passwordDisplay').value = '';
        }
        
        // 页面加载时自动生成一个密码
        window.onload = function() {
            generatePassword();
        };
    </script>
</body>
</html>
